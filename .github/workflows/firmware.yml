# Builds the firmware on every push and pull request (the files are kept as the
# run's artifact for 30 days). A pushed tag v* also makes a GitHub release with
# them: git tag v1.0.0 && git push origin v1.0.0
# A release tag (no '-', so not v1.1.0-rc1) also publishes the web flasher
# (web/index.html + the firmware), the documentation (README.md and docs/, variants and internals too,
# as HTML, under /docs/) and the code's documentation (Doxygen, under /code/) on GitHub Pages. To publish it for an existing
# tag: Actions > Firmware > Run workflow, and pick the tag.
# Needs, once: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  ARDUINO_CLI_VERSION: 1.6.0
  ESP32_CORE_VERSION: 3.3.12
  LVGL_VERSION: 9.6.0
  ESP32_INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  FQBN: esp32:esp32:esp32p4:PSRAM=enabled,FlashSize=32M,PartitionScheme=custom,ChipVariant=prev3

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # the release (tags only)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # tags, for the version name

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      # The esp32 core is about 6 GB installed: too big to cache usefully, so it's
      # downloaded each time, and its archives deleted to keep the runner's disk free.
      - name: Install the esp32 core and LVGL
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX_URL"
          arduino-cli core install "esp32:esp32@$ESP32_CORE_VERSION" --additional-urls "$ESP32_INDEX_URL"
          rm -rf ~/.arduino15/staging
          arduino-cli lib install "lvgl@$LVGL_VERSION"
          # LVGL looks for lv_conf.h next to its folder: <sketchbook>/libraries/lv_conf.h
          libs="$(arduino-cli config get directories.user)/libraries"
          cp extras/lv_conf.h "$libs/lv_conf.h"
          df -h / | tail -1

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="${GITHUB_REF_NAME}"; else v="$(git describe --tags --always --dirty)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Build
        run: |
          arduino-cli compile --fqbn "$FQBN" --build-path build --warnings default . 2>&1 | tee build.log
          grep -E "^Sketch uses" build.log >> "$GITHUB_STEP_SUMMARY" || true
          tools/build_extras.sh build | tee -a "$GITHUB_STEP_SUMMARY"   # fails if the app outgrows its slot

      - name: Package
        run: |
          tools/package_release.sh build dist "${{ steps.version.outputs.version }}"
          { echo; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Docs' lists of variants
        run: python3 tools/doc_lists.py --check   # (made from the code: python3 tools/doc_lists.py)

      - name: Web flasher site
        env:
          REQUIRE_CODE_DOCS: 1                  # the code docs (/code/) must be there
        run: |
          pip install markdown-it-py==3.0.0     # docs: Markdown to HTML (tools/make_docs_site.py)
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen graphviz   # the code docs (Doxyfile)
          tools/make_flasher_site.sh build site "${{ steps.version.outputs.version }}" | tee site.log
          grep "^code docs:" site.log >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: esp32p4_sudoku-${{ steps.version.outputs.version }}
          path: |
            dist/*.bin
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 30

      - name: Web flasher for Pages
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Sudoku ${{ steps.version.outputs.version }}
          body_path: dist/RELEASE.md
          files: |
            dist/*.bin
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
